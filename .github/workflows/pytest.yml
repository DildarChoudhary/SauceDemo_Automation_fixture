# Workflow ka naam
name: SauceDemo Automation Tests

# Workflow kab execute hoga
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

# Workflow jobs
jobs:
  test:
    # GitHub ka Windows runner use hoga
    runs-on: windows-latest

    steps:
      # Step 1: GitHub repository ka code download
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Python dependencies install
      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      # Step 4: Playwright browsers install
      - name: Install Playwright Browsers
        run: python -m playwright install chromium firefox webkit

      # Step 5: Pytest automation tests execute
      - name: Run Automation Tests
        run: python -m pytest Tests -v


