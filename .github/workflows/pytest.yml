# Workflow Name
name: SauceDemo Automation Tests

# Workflow Trigger
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

# Workflow Jobs

jobs:
  test:
    name: Run Tests on ${{ matrix.browser }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      # Step 4: Install Current Browser
      - name: Install Playwright Browser
        run: python -m playwright install ${{ matrix.browser }}

      # Step 5: Run Browser Tests
      - name: Run Automation Tests
        run: python -m pytest Tests -v --browser ${{ matrix.browser }} --html=reports/report-${{ matrix.browser }}.html --self-contained-html

      # Step 6: Upload Reports and Screenshots
      - name: Upload Test Reports and Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            reports/
            screenshots/
          if-no-files-found: warn

